
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS</title>
  <style>
    body {
      background: #050b16;
      color: #62dcff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
    }
    .panel {
      max-width: 400px;
      margin: 30px auto;
      padding: 25px;
      border: 1px solid #168cc2;
      border-radius: 20px;
      box-shadow: 0 0 20px #168cc255;
    }
    button {
      background: #10314a;
      color: white;
      border: 1px solid #62dcff;
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 16px;
      margin: 8px;
    }
  </style>
</head>
<body>
  <h1>J.A.R.V.I.S.</h1>
  <p>PERSONAL ASSISTANT SYSTEM</p>

  <div class="panel">
    <p id="reply">Good evening, sir. I am online.</p>
 <button onclick="greet()">Test JARVIS</button><button onclick="listenToMe()">Talk to JARVIS</button>
  </div>

  <script>
    function greet() {
      const message = "At your service, sir.";
      document.getElementById("reply").textContent = message;

      if ("speechSynthesis" in window) {
        const speech = new SpeechSynthesisUtterance(message);
        window.speechSynthesis.speak(speech);
      }
    }
      function listenToMe() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    speak("Sorry, sir. Voice recognition is not supported here.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "en-AU";

  recognition.onresult = function(event) {
    const words = event.results[0][0].transcript.toLowerCase().trim();
    let answer;

    if (words.includes("hello") || words.includes("hi jarvis")) {
      answer = "Hello, sir. How can I help you?";
    } else if (words.includes("how are you")) {
      answer = "All systems are running normally, sir.";
    } else if (words.includes("time")) {
      answer = "The time is " +
        new Date().toLocaleTimeString("en-AU", {
          hour: "numeric",
          minute: "2-digit"
        }) + ", sir.";
    } else if (words.includes("date") || words.includes("day is it")) {
      answer = "Today is " +
        new Date().toLocaleDateString("en-AU", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        }) + ", sir.";
    } else if (words.includes("your name")) {
      answer = "My name is JARVIS, sir. At your service.";
    } else if (words.includes("open youtube")) {
  answer = "Opening YouTube now, sir.";
  window.open("https://www.youtube.com", "_blank");
} else {
  answer = "I heard you say " + words +
    ". I don't know that command yet, sir.";
}

    document.getElementById("reply").textContent = answer;

if (words.includes("open youtube")) {
  document.getElementById("reply").innerHTML =
    'Opening YouTube, sir. <a href="https://www.youtube.com" target="_blank">Tap here to open YouTube</a>';
}
    speak(answer);
  };

  recognition.onerror = function() {
    document.getElementById("reply").textContent =
      "Sorry, sir. I couldn't hear you.";
  };

  recognition.start();
}

function speak(message) {
  const speech = new SpeechSynthesisUtterance(message);
  speech.lang = "en-AU";
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(speech);
}
  </script>
</body>
</html>
